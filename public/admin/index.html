<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/css/site.css?v=30">

<body class="admin">
<header class="admin-head"><div class="wrap">
  <div class="admin-top"><strong>Over The Rainbow shop admin</strong><span class="small" id="who"></span><a href="/" class="small">View shop</a><a href="/cdn-cgi/access/logout" class="small" id="sign-out">Sign out</a></div>
  <div class="admin-tabs-wrap"><div class="admin-tabs" role="tablist" aria-label="Admin sections">
    <button role="tab" id="tab-orders" aria-controls="panel" aria-selected="true" data-tab="orders">Orders</button>
    <button role="tab" id="tab-products" aria-controls="panel" aria-selected="false" data-tab="products">Products</button>
    <button role="tab" id="tab-settings" aria-controls="panel" aria-selected="false" data-tab="settings">Delivery &amp; settings</button>
    <button role="tab" id="tab-pages" aria-controls="panel" aria-selected="false" data-tab="pages">Pages</button>
    <button role="tab" id="tab-blog" aria-controls="panel" aria-selected="false" data-tab="blog">Blog</button>

  </div><button class="tabs-more" type="button" aria-label="Scroll to see more sections"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></div>
</div></header>
<main class="wrap" id="panel" role="tabpanel" tabindex="-1" aria-live="polite"><p class="muted" style="padding:2rem 0">Loading…</p></main>
